[project]
name = "ragbench"
version = "0.1.0"
description = "An evaluated RAG system over scientific papers (QASPER): hybrid retrieval, reranking, and agentic RAG with measured trade-offs."
readme = "README.md"
authors = [
    { name = "GuanJun Liu", email = "andrew289742@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.176",
    "datasets>=5.1.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Qdrant (docker compose up -d)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
